<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmileKit — Your Dental Care Companion</title>
<meta name="description" content="Tap any tooth to log how it feels, time your two-minute brush, never miss a checkup, and know what dental work should cost in India.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf5ec; --paper2:#f2e9d8; --card:#fffdf8; --ink:#2b1d12; --ink2:#6b5844;
  --bronze:#b07d3c; --gold:#d9a441; --terra:#c05f3c; --terra-soft:#f3ddd3;
  --line:#e6dac4; --amber:#d9a441; --ok:#8a6d2f; --shadow:0 10px 30px rgba(43,29,18,.10);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.12}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--bronze)}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze)}
.muted{color:var(--ink2)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:15px;background:var(--ink);color:#fdf8ee;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(43,29,18,.22)}
.btn.gold{background:linear-gradient(135deg,#c99a4b,#a87c2e);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#241708,#3a2410 55%,#5c3a17);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f8efdd;text-align:center;cursor:pointer;transition:opacity .6s}
#intro.hide{opacity:0;pointer-events:none}
#intro .toothmark{width:92px;height:92px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
#intro h1{font-size:clamp(44px,9vw,84px);letter-spacing:.02em;margin-top:14px}
#intro h1 span{display:inline-block;opacity:0;animation:rise .7s forwards}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
#intro p{opacity:0;animation:rise .7s .5s forwards;color:#e8d5ae;font-size:clamp(15px,2.6vw,19px);margin-top:8px}
#intro .bar{width:min(280px,70vw);height:4px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:34px;overflow:hidden}
#intro .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e8b64c,#c98a3d);animation:load 4s linear forwards}
#intro.quick .bar i{animation-duration:1.2s}
@keyframes load{to{width:100%}}
#intro .skip{position:absolute;bottom:26px;font-size:13px;color:#d8c49a;letter-spacing:.08em;text-transform:uppercase}
/* ---------- header ---------- */
header.site{position:sticky;top:0;z-index:60;background:rgba(250,245,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;gap:14px;padding:12px 20px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:23px;text-decoration:none;color:var(--ink)}
.logo svg{width:34px;height:34px}
nav.main{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
nav.main a{color:var(--ink2);text-decoration:none;font-size:14px;font-weight:600;padding:8px 11px;border-radius:99px}
nav.main a:hover{background:var(--paper2);color:var(--ink)}
@media(max-width:760px){nav.main{display:none}}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden;margin-bottom:26px}
.hero .photo{height:460px;overflow:hidden;position:relative}
.hero .photo img{width:100%;height:100%;object-fit:cover;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-12px,-8px)}}
.hero .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,18,6,.05) 40%,rgba(30,18,6,.72))}
.hero .copy{position:absolute;left:0;right:0;bottom:0;padding:0 20px 30px;color:#fdf6e7}
.hero .copy .wrap{padding:0}
.hero h1{font-size:clamp(38px,6.4vw,64px);color:#fdf6e7;max-width:640px}
.hero h1 em{color:#f0c268;font-style:normal}
.hero .sub{margin-top:10px;font-size:clamp(15px,2.4vw,18px);color:#efe2c4;max-width:560px}
.hero .cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hero .btn.ghost{color:#fdf6e7;border-color:rgba(253,246,231,.55)}
.alertbar{margin-top:16px;background:#fdf1e3;border:1px solid #ecd9b8;border-left:5px solid var(--terra);border-radius:14px;padding:13px 16px;display:flex;gap:12px;align-items:flex-start}
.alertbar b{color:#8a3b1d}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 26px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:16px 18px}
.stat .n{font-family:'Fraunces',serif;font-size:30px;font-weight:700;line-height:1}
.stat .l{font-size:12.5px;color:var(--ink2);margin-top:5px;font-weight:600}
